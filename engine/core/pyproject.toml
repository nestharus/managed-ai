[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g60-continuation-support"
dynamic = ["version"]
description = "Local return collection and explicit source-bound continuation exchange"
requires-python = ">=3.10"
readme = "CORE.md"

[tool.setuptools.dynamic]
version = {attr = "core.__version__"}

[tool.setuptools]
packages = ["core", "core.exchange", "core.exchange.transport", "core.cli"]

[tool.setuptools.package-dir]
core = "."

[project.scripts]
g60-attend = "core.attention:main"
g60-work = "core.exchange.cli:main"
g60-collect = "core.exchange.transport.collector:main"
