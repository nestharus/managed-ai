[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g60-continuation-support"
version = "0.4.1"
description = "Local return collection and explicit source-bound continuation exchange"
requires-python = ">=3.10"
readme = "CORE.md"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
g60-attend = "continuation_support.attention:main"
g60-work = "continuation_support.exchange:main"
g60-collect = "continuation_support.collector:main"
