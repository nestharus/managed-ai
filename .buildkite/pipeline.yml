env:
  PYTHONDONTWRITEBYTECODE: "1"
  IMAGE_REGISTRY: "ghcr.io/nestharus"
  IMAGE_NAME: "managed-ai-information"

steps:
  - label: ":ruff: Lint & format check (ruff)"
    key: "lint"
    command: "uvx --from ruff==0.17.6 ruff check src scripts tests && uvx --from ruff==0.17.6 ruff format --check src scripts tests"

  - label: ":mag_right: Static typecheck (ty & mypy)"
    key: "typecheck"
    command: "uvx --from ty==0.0.112 ty check src scripts && uvx --from mypy==2.4.1 mypy src scripts"

  - label: ":pytest: Unit & integration tests"
    key: "unit-tests"
    command: "python3 -B -m unittest discover -s tests"

  - label: ":shield: Release acceptance check"
    key: "release-check"
    command: "python3 -B scripts/release/check_current.py"

  - label: ":mag: Deployment & IaC static audit"
    key: "deploy-static"
    command: "python3 -B scripts/ci/validate_deploy.py"

  - label: ":chart_with_upwards_trend: Semantic complexity & working-set budget"
    key: "semantic-profile"
    command: "python3 -B scripts/ci/semantic_profile.py --check-budget --baseline scripts/ci/semantic-baseline.json"

  - label: ":package: PEP-517 wheel isolation audit"
    key: "wheel-audit"
    command: "python3 -B -m unittest tests/release/test_package_wheel.py"

  # Hard staged gate: failing PRs or audits build ZERO container images.
  - wait

  - label: ":docker: Content-hash-gated immutable image build"
    key: "image-build"
    command: |
      set -euo pipefail
      CONTEXT_JSON="$(python3 -B scripts/ci/image_lifecycle.py context-hash --root .)"
      CONTEXT_SHA="$(printf '%s' "$CONTEXT_JSON" | python3 -B -c "import json,sys; print(json.load(sys.stdin)['context_sha256'])")"
      echo "Build context digest: $CONTEXT_SHA"

      if [ -n "${BUILDKITE_TAG:-}" ]; then
        VERSION="${BUILDKITE_TAG#v}"
        PLAN_JSON="$(python3 -B scripts/ci/image_lifecycle.py tag-plan --channel release --git-sha "$BUILDKITE_COMMIT" --context-sha "$CONTEXT_SHA" --version "$VERSION" --registry "$IMAGE_REGISTRY" --image "$IMAGE_NAME")"
      elif [ "${BUILDKITE_BRANCH:-}" = "main" ]; then
        PLAN_JSON="$(python3 -B scripts/ci/image_lifecycle.py tag-plan --channel main --git-sha "$BUILDKITE_COMMIT" --context-sha "$CONTEXT_SHA" --registry "$IMAGE_REGISTRY" --image "$IMAGE_NAME")"
      else
        PR_ARGS=()
        if [ -n "${BUILDKITE_PULL_REQUEST:-}" ] && [ "${BUILDKITE_PULL_REQUEST}" != "false" ]; then
          PR_ARGS=(--pr-number "${BUILDKITE_PULL_REQUEST}")
        fi
        PLAN_JSON="$(python3 -B scripts/ci/image_lifecycle.py tag-plan --channel pr --git-sha "$BUILDKITE_COMMIT" --context-sha "$CONTEXT_SHA" "${PR_ARGS[@]}" --registry "$IMAGE_REGISTRY" --image "$IMAGE_NAME")"
      fi

      printf '%s\n' "$PLAN_JSON" > image-tag-plan.json
      PUSH_REMOTE="$(printf '%s' "$PLAN_JSON" | python3 -B -c "import json,sys; print('1' if json.load(sys.stdin)['push_remote'] else '0')")"
      PRIMARY_REF="$(printf '%s' "$PLAN_JSON" | python3 -B -c "import json,sys; print(json.load(sys.stdin)['references'][0])")"
      CONTEXT_TAG="$(printf '%s' "$PLAN_JSON" | python3 -B -c "import json,sys; print(json.load(sys.stdin)['context_tag'])")"

      PROMOTION_TAGS=()
      while IFS= read -r TAG; do
        [ -n "$TAG" ] && PROMOTION_TAGS+=("$TAG")
      done < <(printf '%s' "$PLAN_JSON" | python3 -B -c "import json,sys; print('\n'.join(json.load(sys.stdin)['promotion_tags']))")

      ALL_REFS=()
      TAG_FLAGS=()
      while IFS= read -r REF; do
        if [ -n "$REF" ]; then
          ALL_REFS+=("$REF")
          TAG_FLAGS+=(-t "$REF")
        fi
      done < <(printf '%s' "$PLAN_JSON" | python3 -B -c "import json,sys; print('\n'.join(json.load(sys.stdin)['references']))")

      # Skip redundant container rebuilds if an image with this exact context digest already exists.
      if command -v crane >/dev/null 2>&1; then
        if EXISTING_DIGEST="$(crane digest "${IMAGE_REGISTRY}/${IMAGE_NAME}:${CONTEXT_TAG}" 2>/dev/null)"; then
          echo "Context unchanged; reusing verified digest ${EXISTING_DIGEST}"
          if [ "$PUSH_REMOTE" = "1" ]; then
            for TAG in "${PROMOTION_TAGS[@]}"; do
              crane tag "${IMAGE_REGISTRY}/${IMAGE_NAME}@${EXISTING_DIGEST}" "$TAG"
            done
            printf '%s\n' "${IMAGE_REGISTRY}/${IMAGE_NAME}@${EXISTING_DIGEST}" > image-digest.txt
          else
            echo "PR build skipped via verified context cache hit (push_remote=false)."
          fi
          exit 0
        fi
      fi

      docker build -f containers/Containerfile \
        --label "org.opencontainers.image.revision=${BUILDKITE_COMMIT}" \
        --label "io.managed-ai-information.context-sha256=${CONTEXT_SHA}" \
        "${TAG_FLAGS[@]}" .

      if [ "$PUSH_REMOTE" = "1" ]; then
        for REF in "${ALL_REFS[@]}"; do
          docker push "$REF"
        done
        DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$PRIMARY_REF")"
        printf '%s\n' "$DIGEST" > image-digest.txt
      else
        echo "PR build-only verified (push_remote=false); no remote registry push performed."
      fi
    artifact_paths:
      - "image-tag-plan.json"
      - "image-digest.txt"
