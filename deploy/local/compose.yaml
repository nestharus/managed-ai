# Local IP-hiding control surface stack for Managed AI.
# The managed-ai store worker lives exclusively on an internal bridge network with zero
# host port bindings. Only the pinned non-root gateway exposes 127.0.0.1 control access.

name: managed-ai

services:
  managed-ai:
    build:
      context: ../..
      dockerfile: containers/Containerfile
    image: managed-ai-local:dev
    user: "10001:10001"
    read_only: true
    init: true
    restart: unless-stopped
    entrypoint: ["python3", "-B", "-c", "import signal; signal.pause()"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MANAGED_AI_HOME: /var/lib/managed-ai
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - managed_ai_store:/var/lib/managed-ai
    networks:
      - managed_ai_internal
    healthcheck:
      test: ["CMD", "managed-ai", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  gateway:
    image: nginxinc/nginx-unprivileged:1.27.4-alpine
    user: "101:101"
    read_only: true
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:${MANAGED_AI_CONTROL_PORT:-8480}:8080"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      managed-ai:
        condition: service_healthy
    networks:
      - managed_ai_internal
      - managed_ai_edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  managed_ai_internal:
    driver: bridge
    internal: true
  managed_ai_edge:
    driver: bridge

volumes:
  managed_ai_store:
    driver: local
