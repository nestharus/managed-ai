# Loopback-only local control gateway for Managed AI Information.
# Hides internal container IPs and strips upstream server headers.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","surface":"managed-ai-information-local-control"}';
    }

    location = /control/route-status {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_pass http://managed-ai-information:8081/control/route-status;
    }

    location = /control/route-parity {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_pass http://managed-ai-information:8081/control/route-parity;
    }

    location /control/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_pass http://managed-ai-information:8081/;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"route-not-exposed"}';
    }
}
