[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "managed-ai"
dynamic = ["version"]
description = "Schema-governed local store, explicit continuation exchange, and shared deployment engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.112",
    "mypy>=2.4.1",
]

[project.scripts]
managed-ai = "managed_ai.store.manage_store:main"
managed-ai-deploy = "managed_ai.deployment.select_deployment:main"
managed-ai-library = "managed_ai.library.cli:main"
g60-attend = "managed_ai.core.attention:main"
g60-work = "managed_ai.core.exchange.cli:main"
g60-collect = "managed_ai.core.exchange.transport.collector:main"

[tool.setuptools.dynamic]
version = {attr = "managed_ai.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
managed_ai = [
    "py.typed",
    "CURRENT-RELEASE.json",
    "core/NOTICE.md",
    "store/GUIDE.md",
    "store/catalogue.json",
    "store/bodies/*.txt",
    "library/source-map.json",
    "companions/peer/COMPONENTS.json",
    "companions/peer/configs/*.json",
    "companions/workbench/configs/*.json",
]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF", "PIE", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
"examples/**" = ["S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.15"
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

[tool.ty.environment]
python-version = "3.15"
extra-paths = ["src"]
