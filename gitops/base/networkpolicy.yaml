apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: managed-ai-information
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: managed-ai-information
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: managed-ai-information
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: managed-ai-information-gateway
      ports:
        - protocol: TCP
          port: 8081
